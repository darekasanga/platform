<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change password | SenSei Admin</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.15), transparent 45%),
          linear-gradient(135deg, #0f172a, #111827 55%, #0f172a);
        color: #0f172a;
      }
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .card {
        width: min(560px, 100%);
        background: #ffffff;
        padding: 2.25rem;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.9rem;
        color: #0f172a;
      }
      p {
        margin: 0 0 1.5rem;
        color: #475569;
      }
      label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 700;
        color: #0f172a;
      }
      input {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 1rem;
        transition: border-color 120ms ease-in-out, box-shadow 120ms ease-in-out;
      }
      input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
      }
      button {
        width: 100%;
        padding: 0.95rem;
        background: linear-gradient(135deg, #0ea5e9, #38bdf8);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        transition: background 120ms ease-in-out, box-shadow 120ms ease-in-out, transform 120ms ease-in-out;
        box-shadow: 0 12px 26px rgba(14, 165, 233, 0.25);
      }
      button:hover {
        background: linear-gradient(135deg, #0284c7, #0ea5e9);
        transform: translateY(-1px);
      }
      .message {
        margin-top: 0.75rem;
        padding: 0.85rem 1rem;
        border-radius: 10px;
        font-weight: 700;
      }
      .message.success {
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #064e3b;
      }
      .message.error {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #7f1d1d;
      }
      .requirements {
        background: #f8fafc;
        border-radius: 12px;
        padding: 0.85rem 1rem;
        border: 1px dashed #cbd5f5;
        color: #334155;
        font-size: 0.92rem;
        margin-bottom: 1.5rem;
      }
      .back-link {
        display: inline-block;
        margin-top: 1rem;
        color: #0ea5e9;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>パスワード変更</h1>
        <p>初回ログインのため、新しい管理者パスワードを設定してください。</p>
        <div class="requirements">
          8文字以上の強度を推奨しています。変更後は管理画面へ遷移します。
        </div>
        <form id="change-password-form">
          <label for="current-password">Current password</label>
          <input type="password" id="current-password" autocomplete="current-password" required />

          <label for="new-password">New password</label>
          <input type="password" id="new-password" autocomplete="new-password" required />

          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" required />

          <button type="submit">Update password</button>
        </form>
        <div class="message" id="password-message" role="status" aria-live="polite"></div>
        <a class="back-link" href="./login.html">← Back to login</a>
      </div>
    </div>
    <script src="./admin-utils.js"></script>
    <script>
      (() => {
        const form = document.getElementById("change-password-form");
        const message = document.getElementById("password-message");
        const session = AdminUtils.requireAdminSession({ allowMustChange: true });
        if (!session) return;

        function showMessage(text, type) {
          if (!message) return;
          message.textContent = text;
          message.className = `message ${type}`;
        }

        form?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const currentPassword = document.getElementById("current-password").value;
          const newPassword = document.getElementById("new-password").value;
          const confirmPassword = document.getElementById("confirm-password").value;

          if (!currentPassword || !newPassword || !confirmPassword) {
            showMessage("すべての入力欄を埋めてください。", "error");
            return;
          }

          if (newPassword.length < 8) {
            showMessage("新しいパスワードは8文字以上で設定してください。", "error");
            return;
          }

          if (newPassword !== confirmPassword) {
            showMessage("確認用パスワードが一致しません。", "error");
            return;
          }

          const admin = await AdminUtils.ensureSeedAdmin();
          const currentUser = admin.find((user) => user.id === session.id);
          if (!currentUser) {
            showMessage("管理者情報が取得できません。再ログインしてください。", "error");
            return;
          }

          const match = await AdminUtils.verifyPassword(currentPassword, currentUser.password_hash);
          if (!match) {
            showMessage("現在のパスワードが正しくありません。", "error");
            return;
          }

          const hashed = await AdminUtils.hashPassword(newPassword);
          const updatedUser = await AdminUtils.updateAdminPassword(session.id, hashed);
          AdminUtils.logAudit({
            actorAdminId: session.id,
            action: "ADMIN_PASSWORD_CHANGED",
            meta: { username: updatedUser?.username || session.username }
          });
          AdminUtils.setAdminSession({
            ...session,
            must_change_password: false
          });

          showMessage("パスワードを更新しました。管理画面へ移動します。", "success");
          setTimeout(() => {
            window.location.href = "../management.html";
          }, 700);
        });
      })();
    </script>
  </body>
</html>
