<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin login | SenSei</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.15), transparent 45%),
          linear-gradient(135deg, #0f172a, #111827 55%, #0f172a);
        color: #0f172a;
      }
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .card {
        width: min(520px, 100%);
        background: #ffffff;
        padding: 2.25rem;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.9rem;
        color: #0f172a;
      }
      p {
        margin: 0 0 1.5rem;
        color: #475569;
      }
      label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 700;
        color: #0f172a;
      }
      input {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 1rem;
        transition: border-color 120ms ease-in-out, box-shadow 120ms ease-in-out;
      }
      input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
      }
      button {
        width: 100%;
        padding: 0.95rem;
        background: linear-gradient(135deg, #0ea5e9, #38bdf8);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        transition: background 120ms ease-in-out, box-shadow 120ms ease-in-out, transform 120ms ease-in-out;
        box-shadow: 0 12px 26px rgba(14, 165, 233, 0.25);
      }
      button:hover {
        background: linear-gradient(135deg, #0284c7, #0ea5e9);
        transform: translateY(-1px);
      }
      .message {
        margin-top: 0.75rem;
        padding: 0.85rem 1rem;
        border-radius: 10px;
        font-weight: 700;
      }
      .message.success {
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #064e3b;
      }
      .message.error {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #7f1d1d;
      }
      .hint {
        background: #f8fafc;
        border-radius: 12px;
        padding: 0.85rem 1rem;
        border: 1px dashed #cbd5f5;
        color: #334155;
        font-size: 0.92rem;
        margin-bottom: 1.5rem;
      }
      .back-link {
        display: inline-block;
        margin-top: 1rem;
        color: #0ea5e9;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Admin console log in</h1>
        <p>Wi-Fi ローカルネットワーク設定を管理する専用の管理者ログインです。</p>
        <div class="hint">
          初期ログインID / パスワードは <strong>admin001</strong> です。初回ログイン時に必ずパスワード変更が必要です。
        </div>
        <form id="admin-login-form">
          <label for="username">Admin ID</label>
          <input type="text" id="username" name="username" placeholder="admin001" required />

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />

          <button type="submit">Continue to admin console</button>
        </form>
        <div class="message" id="login-message" role="status" aria-live="polite"></div>
        <a class="back-link" href="../index.html">← Back to Platform home</a>
      </div>
    </div>
    <script src="./admin-utils.js"></script>
    <script>
      (() => {
        const loginForm = document.getElementById("admin-login-form");
        const loginMessage = document.getElementById("login-message");

        function showLoginMessage(text, type) {
          if (!loginMessage) return;
          loginMessage.textContent = text;
          loginMessage.className = `message ${type}`;
        }

        loginForm?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;

          if (!username || !password) {
            showLoginMessage("管理者IDとパスワードを入力してください。", "error");
            return;
          }

          await AdminUtils.ensureSeedAdmin();
          const result = await AdminUtils.attemptLogin(username, password);
          if (!result.ok) {
            if (result.reason === "lockout") {
              const unlock = new Date(result.lockUntil).toLocaleTimeString();
              showLoginMessage(`ログイン失敗が続いたためロック中です。${unlock} 以降に再試行してください。`, "error");
              return;
            }
            showLoginMessage("ログインに失敗しました。入力内容を確認してください。", "error");
            return;
          }

          const session = {
            id: result.user.id,
            username: result.user.username,
            must_change_password: result.user.must_change_password,
            lastLogin: new Date().toISOString()
          };
          AdminUtils.setAdminSession(session);

          if (result.user.must_change_password) {
            showLoginMessage("初回ログインのためパスワード変更が必要です。", "success");
            setTimeout(() => {
              window.location.href = "./change-password.html";
            }, 600);
            return;
          }

          showLoginMessage("ログインに成功しました。管理ページへ移動します。", "success");
          setTimeout(() => {
            window.location.href = "../management.html";
          }, 600);
        });
      })();
    </script>
  </body>
</html>
