<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>保護者ログイン | SenSei Platform</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0f172a, #1d2a4a);
        color: #0f172a;
      }
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1.5rem;
        max-width: 960px;
      }
      .card {
        width: 100%;
        background: #ffffff;
        padding: 2rem;
        border-radius: 14px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
      }
      .card.accent {
        background: linear-gradient(135deg, #0f172a, #172554);
        color: #f8fafc;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        color: #0f172a;
      }
      .card.accent h1 {
        color: #f8fafc;
      }
      .subtitle {
        margin: 0 0 1.5rem;
        color: #4b5563;
      }
      .card.accent .subtitle {
        color: #e2e8f0;
      }
      p {
        margin: 0 0 1rem;
        color: #4b5563;
      }
      .card.accent p {
        color: #e2e8f0;
      }
      label {
        display: block;
        margin-bottom: 0.35rem;
        font-weight: 600;
        color: #0f172a;
      }
      .card.accent label {
        color: #f8fafc;
      }
      input {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 1rem;
        transition: border-color 120ms ease-in-out, box-shadow 120ms ease-in-out;
      }
      input:focus {
        outline: none;
        border-color: #0055ff;
        box-shadow: 0 0 0 3px rgba(0, 85, 255, 0.15);
      }
      button {
        width: 100%;
        padding: 0.9rem;
        background: #0055ff;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 120ms ease-in-out, box-shadow 120ms ease-in-out;
      }
      .card.accent button {
        background: #f8fafc;
        color: #0f172a;
      }
      button:hover {
        background: #0042c4;
        box-shadow: 0 12px 24px rgba(0, 85, 255, 0.25);
      }
      .card.accent button:hover {
        background: #e2e8f0;
        box-shadow: 0 12px 24px rgba(248, 250, 252, 0.25);
      }
      .message {
        margin-top: 0.75rem;
        padding: 0.85rem 1rem;
        border-radius: 10px;
        font-weight: 700;
      }
      .message.success {
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #064e3b;
      }
      .message.error {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #7f1d1d;
      }
      .message.warning {
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.4);
        color: #92400e;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.6rem;
        margin-top: 0.6rem;
      }
      .actions button.secondary {
        background: #f1f5f9;
        color: #0f172a;
        border: 1px solid #d1d5db;
      }
      .fine-print {
        margin-top: 1rem;
        font-size: 0.9rem;
        color: #cbd5e1;
      }
      .notice {
        background: rgba(14, 165, 233, 0.1);
        border: 1px solid rgba(14, 165, 233, 0.4);
        padding: 0.75rem;
        border-radius: 12px;
        color: #0c4a6e;
        font-weight: 600;
        margin-top: 0.75rem;
      }
      .card.accent .notice {
        background: rgba(248, 250, 252, 0.2);
        border-color: rgba(248, 250, 252, 0.35);
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grid">
        <div class="card">
          <h1>SMSでログイン（推奨）</h1>
          <p class="subtitle">電話番号で本人確認して、保護者通知に進みます。</p>
          <div class="notice">園児名などの内容はログイン後に表示されます</div>
          <div class="notice">QRは入口で、個人情報は含みません</div>
          <form id="sms-start-form">
            <label for="phone">電話番号（E.164）</label>
            <input type="tel" id="phone" name="phone" placeholder="+819012345678" required />
            <button type="submit">SMSで続ける</button>
          </form>
          <form id="sms-verify-form" style="display: none;">
            <label for="code">認証コード</label>
            <input type="text" id="code" name="code" placeholder="6桁" required />
            <button type="submit">認証</button>
          </form>
          <div class="message" id="sms-message" role="status" aria-live="polite"></div>
        </div>
        <div class="card accent">
          <h1>アカウントをお持ちの方</h1>
          <p class="subtitle">お持ちのアカウントで本人確認できます（新規作成は不要）</p>
          <div class="actions">
            <button class="secondary" type="button" data-provider="microsoft">Microsoftで続ける</button>
            <button class="secondary" type="button" data-provider="apple">Appleで続ける</button>
            <button class="secondary" type="button" data-provider="google">Googleで続ける</button>
            <button class="secondary" type="button" data-provider="yahoo">Yahoo!で続ける</button>
          </div>
          <p class="fine-print">ログインは本人確認であり、通知手段とは分離されています。</p>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const smsStartForm = document.getElementById("sms-start-form");
        const smsVerifyForm = document.getElementById("sms-verify-form");
        const smsMessage = document.getElementById("sms-message");
        const phoneInput = document.getElementById("phone");
        const codeInput = document.getElementById("code");
        const providerButtons = document.querySelectorAll("button[data-provider]");
        const urlParams = new URLSearchParams(window.location.search);
        const returnTo = urlParams.get("return_to") || "/";
        let currentChallengeId = null;

        const setMessage = (text, type = "success") => {
          smsMessage.textContent = text;
          smsMessage.className = `message ${type}`;
        };

        smsStartForm?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const phone = phoneInput.value.trim();
          if (!phone) {
            setMessage("電話番号を入力してください。", "error");
            return;
          }

          const response = await fetch("/auth/sms/start", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone_e164: phone, purpose: "LINK_BY_QR", return_to: returnTo })
          });

          if (!response.ok) {
            setMessage("SMS送信に失敗しました。しばらくして再試行してください。", "error");
            return;
          }

          const payload = await response.json();
          currentChallengeId = payload.challenge_id;
          smsStartForm.style.display = "none";
          smsVerifyForm.style.display = "block";
          setMessage("SMSを送信しました。届いたコードを入力してください。", "success");

          if (payload.debug_code) {
            setMessage(`開発用コード: ${payload.debug_code}`, "warning");
          }
        });

        smsVerifyForm?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const code = codeInput.value.trim();
          if (!currentChallengeId || !code) {
            setMessage("認証コードを入力してください。", "error");
            return;
          }

          const response = await fetch("/auth/sms/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ challenge_id: currentChallengeId, code })
          });

          if (!response.ok) {
            const errorPayload = await response.json().catch(() => ({}));
            setMessage(errorPayload.message || "認証に失敗しました。", "error");
            return;
          }

          setMessage("認証に成功しました。移動します…", "success");
          setTimeout(() => {
            window.location.href = returnTo;
          }, 400);
        });

        providerButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const provider = button.dataset.provider;
            window.location.href = `/auth/${provider}/login?return_to=${encodeURIComponent(returnTo)}`;
          });
        });
      })();
    </script>
  </body>
</html>
